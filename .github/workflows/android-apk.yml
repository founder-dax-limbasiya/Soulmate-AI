name: Build Soulmate AI APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check cloud gateway Python syntax
        run: python3 -m py_compile server/gateway/app.py

      - name: Check embedded UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("Embedded JavaScript block is missing")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/soulmate-ui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/soulmate-ui.js

      - name: Build lightweight cloud-connected APK
        run: gradle --no-daemon assembleDebug

      - name: Verify the APK does not contain model weights
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if unzip -Z1 "$APK" | grep -Eiq '\.(litertlm|gguf|safetensors)$'; then
            echo "A model weight file was unexpectedly packaged in the APK."
            exit 1
          fi
          APK_BYTES="$(stat -c%s "$APK")"
          echo "Lightweight APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -gt 60000000 ]; then
            echo "APK is unexpectedly larger than 60 MB."
            exit 1
          fi
          echo "- APK size: $APK_BYTES bytes; no model weights bundled." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soulmate-ai-cloud-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
