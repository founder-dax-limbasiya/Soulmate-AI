name: Publish verified Luna models
on:
  push:
    branches: [luna-compose-offline]
    paths: ['.github/workflows/luna-models.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: luna-models-v1
jobs:
  model-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify original model artifacts and publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=luna-models-v1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Verify assets manually before replacing any."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/models"
          cd "$RUNNER_TEMP/models"
          for kind in q4_0 q4_k_m; do
            file="qwen2.5-0.5b-instruct-${kind}.gguf"
            curl -fL --retry 3 -o "$file" "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/$file"
          done
          echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  qwen2.5-0.5b-instruct-q4_0.gguf' > SHA256SUMS
          echo '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  qwen2.5-0.5b-instruct-q4_k_m.gguf' >> SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Luna offline models v1" --notes "Original Qwen2.5-0.5B-Instruct quantized GGUF files, Qwen team, licensed under Apache 2.0." *.gguf SHA256SUMS "$GITHUB_WORKSPACE/luna/app/src/main/assets/Qwen-LICENSE.txt" "$GITHUB_WORKSPACE/luna/app/src/main/assets/NOTICE.txt"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
