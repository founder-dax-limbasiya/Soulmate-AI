name: Soulmate AI ARM64 APK

on:
  push:
    branches:
      - feature/apk-under-50mb
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build minified ARM64 APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK size and contents
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BYTES="$(stat -c '%s' "$APK")"
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "APK_BYTES=$BYTES" >> "$GITHUB_OUTPUT"
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt 50000000 ]; then
            echo "::error::APK is over the 50 MB target."
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -Eiq '\.(litertlm|gguf|safetensors)$'; then
            echo "::error::Model weights must stay outside the APK and download to phone-private storage."
            exit 1
          fi

          ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Expected an ARM64-only APK. Found: $ABIS"
            exit 1
          fi

          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: soulmate-ai-v0.6.1-arm64-under-50mb
          path: ${{ steps.verify.outputs.APK }}
          if-no-files-found: error
          retention-days: 14
