plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.realworldgta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soulmateai.companion'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '0.6.1'

        // LiteRT-LM ships native inference libraries for ARM64 Android phones.
        // Excluding emulator-only ABIs keeps the distributable APK compact.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device text generation. Model weights download once to app-private storage.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
}
