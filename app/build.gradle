plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.realworldgta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soulmateai.companion'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.5.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Lightweight HTTPS streaming client; inference runs on the configured cloud server.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
